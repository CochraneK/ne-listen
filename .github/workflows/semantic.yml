name: Deep semantic analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/semantic.yml"

permissions:
  contents: write

concurrency:
  group: semantic-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      NELISTEN_DATA_DIR: build/semantic
      MUSIC_U_VALUE: ${{ secrets.NETEASE_MUSIC_U }}
      NELISTEN_SEMANTIC_MODEL: intfloat/multilingual-e5-small
      NELISTEN_SEMANTIC_REVISION: f470c6a1a906014160ece1968c484b275f0396de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require real-account secret
        shell: bash
        run: |
          test -n "$MUSIC_U_VALUE" || { echo "NETEASE_MUSIC_U is required"; exit 1; }
      - name: Install semantic dependencies
        run: python -m pip install -e '.[deep,semantic]'
      - name: Collect private deep corpus
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 nohup npx --yes @neteasecloudmusicapienhanced/api@4.40.1 >/tmp/ncm-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          export NELISTEN_COOKIE="MUSIC_U=${MUSIC_U_VALUE}"
          python -m nelisten sync --base-url http://127.0.0.1:3000 --data-dir "$NELISTEN_DATA_DIR" --text-max 360 --text-workers 6
      - name: Build public-safe semantic aggregate
        run: |
          python -m nelisten semantic --data-dir "$NELISTEN_DATA_DIR" --output public/semantic.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("public/semantic.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          raw = p.read_text(encoding="utf-8").lower()
          assert obj.get("available") is True
          for forbidden in ("music_u", '"lyrics"', '"embeddings"', '"songids"', '"songtitles"'):
              assert forbidden not in raw, forbidden
          assert obj.get("safety", {}).get("containsLyrics") is False
          PY
      - name: Publish semantic aggregate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/semantic.json
          if git diff --cached --quiet; then
            echo "Semantic aggregate unchanged."
          else
            git commit -m "data: refresh public semantic aggregate"
            git push
          fi
