[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ne-listen"
version = "0.1.0"
description = "Local-first NetEase Cloud Music listening archive and personal report generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cochrane Kang"}]
dependencies = []

[project.scripts]
ne-listen = "nelisten.cli:main"

[tool.setuptools.packages.find]
include = ["nelisten*"]
